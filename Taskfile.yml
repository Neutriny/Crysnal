version: '3'

# Crysnal 构建任务。CGO_ENABLED=0：不依赖本地 C 工具链，产出可静态编译的 Windows/Linux 二进制。
# 用法：task（默认）/ task build-backend / task build-frontend / task dev / task clean

vars:
  GO: go
  PNPM: pnpm
  EXE: '{{if eq OS "windows"}}crysnal.exe{{else}}crysnal{{end}}'
  DIST_SRC: web/dist
  DIST_DST: internal/server/dist
  # 链接时合并进 exe 的 Windows 资源对象（图标 + 版本信息），构建产物、不入库
  SYSO: rsrc_windows_amd64.syso
  # 固定版本，避免构建依赖随上游漂移
  GOVERSIONINFO_PKG: github.com/josephspurrier/goversioninfo/cmd/goversioninfo
  GOVERSIONINFO_VER: v1.7.0

tasks:
  default:
    desc: 构建前端 + 拷贝 dist + 编译 Go（CGO 关闭）
    deps: [build-backend]

  build-frontend:
    desc: 构建 Vue 前端（web/）
    dir: web
    cmds:
      - '{{.PNPM}} build'

  copy-dist:
    desc: 把 web/dist 拷贝到 internal/server/dist（go:embed 的源目录）
    deps: [build-frontend]
    cmds:
      - cmd: >-
          powershell -NoProfile -Command
          "New-Item -ItemType Directory -Force -Path '{{.DIST_DST}}' | Out-Null;
          Copy-Item -Recurse -Force '{{.DIST_SRC}}\*' '{{.DIST_DST}}'"
        platforms: [windows]
      - cmd: 'cp -rf {{.DIST_SRC}}/* {{.DIST_DST}}/'
        platforms: [linux, darwin]

  gen-res:
    desc: 生成 Windows 资源对象（应用图标 + 版本信息）
    sources:
      - assets/app.ico
      - assets/versioninfo.json
      - Taskfile.yml
    generates:
      - '{{.SYSO}}'
    cmds:
      # .syso 文件名带 _windows_amd64 后缀，非 windows/amd64 构建会自动忽略它
      - cmd: >-
          {{.GO}} run {{.GOVERSIONINFO_PKG}}@{{.GOVERSIONINFO_VER}}
          -icon assets/app.ico
          -o {{.SYSO}}
          assets/versioninfo.json
        platforms: [windows]

  build-backend:
    desc: 编译 Go（CGO_ENABLED=0）
    deps: [copy-dist, gen-res]
    env:
      CGO_ENABLED: '0'
    cmds:
      - '{{.GO}} build -o {{.EXE}} .'

  dev:
    desc: 构建一次后启动 Go 面板（前端热更新请另开终端跑 pnpm dev）
    deps: [build-backend]
    cmds:
      - '{{.EXE}} -addr ":8080"'

  clean:
    desc: 清理构建产物
    cmds:
      - cmd: >-
          powershell -NoProfile -Command
          "Remove-Item -Recurse -Force
          '{{.DIST_DST}}', '{{.DIST_SRC}}', '{{.EXE}}', '{{.SYSO}}'
          -ErrorAction SilentlyContinue"
        platforms: [windows]
      - cmd: 'rm -rf {{.DIST_DST}} {{.DIST_SRC}} {{.EXE}} {{.SYSO}}'
        platforms: [linux, darwin]
